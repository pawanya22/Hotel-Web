<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Package Details | Luxury Travel Guru</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #c9a84c; --bg: #f8f6f1; --text: #1a1714; --text-mid: #4a4540; --white: #fff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--bg); font-family: 'Jost', sans-serif; color: var(--text); line-height: 1.6; padding-top: 120px; }
    
    /* NAV */
    nav { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 1400px; padding: 14px 36px; display: flex; justify-content: space-between; align-items: center; background: rgba(10,8,6,0.92); backdrop-filter: blur(24px); border-radius: 100px; z-index: 1000; }
    .logo { font-family: 'Cormorant Garamond', serif; color: #fff; text-transform: uppercase; letter-spacing: 6px; text-decoration: none; font-size: 1.15rem; }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { color: rgba(255,255,255,0.72); text-decoration: none; font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; }
    .nav-links a:hover { color: var(--gold); }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
    .hero-img { width: 100%; max-height: 500px; object-fit: cover; border-radius: 16px; margin-bottom: 40px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 400; margin-bottom: 15px; }
    .price-tag { font-size: 2rem; color: var(--gold); font-weight: 600; margin-bottom: 30px; }
    .price-tag .old { text-decoration: line-through; font-size: 1.2rem; color: #aaa; margin-right: 15px; }
    .overview { font-size: 1.1rem; line-height: 1.8; color: var(--text-mid); margin-bottom: 50px; max-width: 800px; }
    
    .inclusions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 50px; }
    .inclusion-item { background: white; padding: 15px 20px; border-radius: 10px; border: 1px solid #eee; }
    
    .itinerary-day { margin-bottom: 30px; padding-left: 20px; border-left: 3px solid var(--gold); }
    .itinerary-day h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; margin-bottom: 10px; color: var(--gold); }
    .meals { margin-top: 10px; font-size: 0.8rem; color: #888; }
    
    footer { padding: 50px 60px; background: #0a0806; color: white; margin-top: 80px; text-align: center; }
    .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.7rem; letter-spacing: 7px; display: block; margin-bottom: 10px; }
    .back-btn { display: inline-block; padding: 10px 25px; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; border-radius: 30px; margin-bottom: 30px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">LUXURY TRAVEL GURU</a>
  <ul class="nav-links">
    <li><a href="index.html">HOME</a></li>
    <li><a href="about.html">ABOUT</a></li>
    <li><a href="hotel.html">HOTELS</a></li>
    <li><a href="packages.html" style="color:var(--gold)">PACKAGES</a></li>
    <li><a href="contact.html">CONTACT</a></li>
  </ul>
</nav>

<div class="container">
  <a href="packages.html" class="back-btn">← Back to Packages</a>
  <div id="packageContent">
    <p>Loading...</p>
  </div>
</div>

<footer>
  <span class="footer-logo">LUXURY TRAVEL GURU</span>
  <p style="opacity:0.7;">Curated Luxury Experiences</p>
</footer>

<script>
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { document.getElementById('packageContent').innerHTML = "<p>No package selected.</p>"; }

  async function loadPackage() {
    try {
      const res = await fetch(`/api/packages/${id}`);
      const { data } = await res.json();
      if (!data) return;
      
      document.getElementById('packageContent').innerHTML = `
        <img src="${data.imageUrl}" alt="${data.title}" class="hero-img">
        <h1>${data.title}</h1>
        <p style="font-size:1rem; margin-bottom:20px;">${data.duration} • ${data.locationRoute}</p>
        <div class="price-tag"><span class="old">£${data.priceOriginal}</span> £${data.priceDiscounted}</div>
        <div class="overview">${data.overview || ''}</div>
        
        <h2>What's Included</h2>
        <div class="inclusions-grid">
          ${(data.inclusions || []).map(i => `<div class="inclusion-item">✓ ${i}</div>`).join('')}
        </div>

        <h2>Itinerary</h2>
        ${(data.itinerary || []).length ? data.itinerary.map(day => `
          <div class="itinerary-day">
            <h3>Day ${day.day}: ${day.title}</h3>
            <p>${day.desc}</p>
            <div class="meals">Meals: ${day.meals.join(', ') || 'Not specified'}</div>
          </div>
        `).join('') : '<p>Itinerary details coming soon.</p>'}
      `;
    } catch (err) {
      document.getElementById('packageContent').innerHTML = "<p>Error loading package details.</p>";
    }
  }
  loadPackage();
</script>
</body>
</html>
